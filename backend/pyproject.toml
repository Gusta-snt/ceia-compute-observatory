[project]
name = "ceia-observatory-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
  "psycopg[binary]>=3.2", "pydantic>=2.7", "pydantic-settings>=2.3",
  "argon2-cffi>=23.1", "pyjwt>=2.8", "python-multipart>=0.0.9", "tzdata",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.services"]
