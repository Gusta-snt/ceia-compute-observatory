# CEIA Compute Observatory — plataforma central.
# Uso: cp ../.env.example ../.env  (edite os segredos)  &&  docker compose --env-file ../.env up -d --build
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: observatory
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatory"]
      interval: 5s
      retries: 20
    # sem 'ports': o banco não é exposto ao host

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql+psycopg://observatory:${POSTGRES_PASSWORD}@db:5432/observatory
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-90}
    # Sem porta pública: o acesso externo passa pelo Caddy. Porta local só para diagnóstico.
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]

  frontend:
    build:
      context: ../frontend
      args: { BACKEND_URL: "http://backend:8000" }
    restart: unless-stopped
    depends_on: [backend]
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    # BIND_ADDR=0.0.0.0 aceita agentes pela internet; 127.0.0.1 = apenas esta máquina.
    ports: ["${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:
