[project]
name = "ceia-observatory-agent"
version = "1.1.0"
description = "Agente de monitoramento do CEIA Compute Observatory para NVIDIA DGX Spark (ARM64)"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "httpx>=0.27"]

[project.optional-dependencies]
nvml = ["nvidia-ml-py>=12"]
dev = ["pytest>=8", "pytest-httpserver>=1.0"]

[project.scripts]
ceia-agent = "ceia_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceia_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
